name: SE strict Stage2-Stage3 self-hosting proof

# This is a deliberately strict and independent proof: it must fail until
# SE's compiler can compile its own complete SE source/module graph.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/selfhost-stage2-strict.yml"

jobs:
  strict-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production bootstrap compiler (Stage0)
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target se --parallel 2
      - name: Require Stage2, Stage3 and Stage4 deterministic self-compilation
        run: python3 tests/selfhost_stage2.py "$(realpath build/se)"
