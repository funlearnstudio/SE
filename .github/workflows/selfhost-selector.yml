name: SE compiler backend selector
on:
  push:
    branches:
      - experiment/se-self-hosting-bootstrap
  pull_request:
    paths:
      - 'tools/se_compiler.py'
      - 'tests/test_se_compiler_selector.py'
      - '.github/workflows/selfhost-selector.yml'
  workflow_dispatch:

jobs:
  selector:
    name: Python selector regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m py_compile tools/se_compiler.py tests/test_se_compiler_selector.py
      - run: python3 -m unittest discover -s tests -p test_se_compiler_selector.py -v
