name: SE CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate VS Code TextMate grammar
        shell: python
        run: |
          import json
          from pathlib import Path

          grammar = json.loads(Path("vscode/syntaxes/se.tmLanguage.json").read_text(encoding="utf-8"))
          assert grammar["scopeName"] == "source.se"
          assert "se" in grammar.get("fileTypes", [])
          assert grammar.get("patterns")
          print("SE TextMate grammar is valid JSON and declares source.se")
      - name: Validate VS Code extension
        run: |
          node --check vscode/extension.js
          node --check vscode/language-data.js
          node --check vscode/diagnostics.js
          node vscode/validate.js
      - name: Validate install.sh syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: CLI smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/se --version
          ./build/se check examples/hello.se
          ./build/se run examples/hello.se
          ./build/se build examples/hello.se
          ./examples/hello
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\Release\se.exe --version
          .\build\Release\se.exe check examples\hello.se
          .\build\Release\se.exe run examples\hello.se
