name: SE selfhost source snapshot

on:
  push:
    branches: [experiment/se-self-hosting-bootstrap]
    paths:
      - 'selfhost/**'
      - '.github/workflows/selfhost-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: se-selfhost-source
          path: selfhost/
          if-no-files-found: error
          retention-days: 7
