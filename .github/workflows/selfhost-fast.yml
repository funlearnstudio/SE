name: SE selfhost fast CI

on:
  push:
    paths:
      - "selfhost/**"
      - "tests/selfhost_differential.py"
      - ".github/workflows/selfhost-fast.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
  pull_request:
    paths:
      - "selfhost/**"
      - "tests/selfhost_differential.py"
      - ".github/workflows/selfhost-fast.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
  workflow_dispatch:

concurrency:
  group: selfhost-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SE production bootstrap
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build production SE CLI
        run: cmake --build build --target se --parallel 2
      - name: Compile and test standalone C++20 runtime (without s_core)
        run: |
          c++ -std=c++20 -O0 -Iselfhost tests/selfhost_runtime.cpp -o build/selfhost_runtime_tests
          ./build/selfhost_runtime_tests
      - name: Run SE selfhost compiler unit and differential cases
        run: python3 tests/selfhost_differential.py "$(realpath build/se)"
