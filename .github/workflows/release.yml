name: SE Release

on:
  workflow_run:
    workflows: ["SE CI"]
    types: [completed]

permissions:
  contents: write

env:
  VERSION: 0.7.0
  TAG: v0.7.0

jobs:
  build-packages:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: se-0.7.0-linux-x64
            archive: tar.gz
          - os: macos-15-intel
            asset: se-0.7.0-macos-x64
            archive: tar.gz
          - os: macos-14
            asset: se-0.7.0-macos-arm64
            archive: tar.gz
          - os: windows-latest
            asset: se-0.7.0-windows-x64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --install build --config Release --prefix "$PWD/package/${{ matrix.asset }}"
          cp LICENSE "$PWD/package/${{ matrix.asset }}/LICENSE"
          cp README.md "$PWD/package/${{ matrix.asset }}/README.md"
          cd package
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'package/${{ matrix.asset }}'
          cmake --install build --config Release --prefix $root
          Copy-Item LICENSE (Join-Path $root 'LICENSE')
          Copy-Item README.md (Join-Path $root 'README.md')
          Compress-Archive -Path $root -DestinationPath "package/${{ matrix.asset }}.zip"

      - name: Verify packaged CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          ./package/${{ matrix.asset }}/bin/se --version
          printf 'say "package ok"\n' > package-smoke.se
          ./package/${{ matrix.asset }}/bin/se run package-smoke.se

      - name: Verify packaged CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "package/${{ matrix.asset }}/bin/se.exe" --version
          'say "package ok"' | Set-Content package-smoke.se
          & "package/${{ matrix.asset }}/bin/se.exe" run package-smoke.se

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: package/${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

  package-vscode:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install VS Code packaging tool
        working-directory: vscode
        run: npm install

      - name: Validate TextMate grammar
        run: |
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('vscode/syntaxes/se.tmLanguage.json','utf8')); if(g.scopeName!=='source.se') process.exit(1);"

      - name: Read VS Code extension version
        id: extension-version
        shell: bash
        run: echo "version=$(node -p "require('./vscode/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package SE VS Code extension
        working-directory: vscode
        run: npx vsce package --out "../se-language-${{ steps.extension-version.outputs.version }}.vsix"

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: se-language-${{ steps.extension-version.outputs.version }}-vsix
          path: se-language-${{ steps.extension-version.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    needs: [build-packages, package-vscode]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: se-*
          path: release-assets
          merge-multiple: true

      - name: Check whether release already exists
        id: release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA256 checksums for a new SE release
        if: steps.release.outputs.exists != 'true'
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update SE 0.7.0 release
        shell: bash
        run: |
          if [ "${{ steps.release.outputs.exists }}" = "true" ]; then
            gh release upload "$TAG" release-assets/se-language-*.vsix --clobber
          else
            gh release create "$TAG" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "SE 0.7.0" \
              --notes-file RELEASE_NOTES.md \
              release-assets/*
          fi
